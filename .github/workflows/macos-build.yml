name: macOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      NEWELLE_ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install \
            python@3.13 \
            gtk4 \
            libadwaita \
            gtksourceview5 \
            pygobject3 \
            adwaita-icon-theme \
            vte3 \
            portaudio \
            librsvg \
            ffmpeg \
            gettext

      - name: Build app
        run: /usr/bin/env bash macos/build_newelle_app.sh

      - name: Run macOS compatibility tests
        run: .venv-macos/bin/python -m unittest discover -s tests -v

      - name: Smoke test packaged app
        run: dist/Newelle.app/Contents/MacOS/Newelle --smoke-test
        timeout-minutes: 3

      - name: Build DMG
        run: NEWELLE_SKIP_APP_BUILD=1 /usr/bin/env bash macos/build_newelle_dmg.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Newelle-macos-${{ matrix.arch }}-dmg
          path: dist/Newelle-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
