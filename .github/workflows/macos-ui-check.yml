name: macOS UI Check

on:
  workflow_dispatch:
    inputs:
      runtime_run:
        description: Successful macOS build containing a packaged DMG
        required: true
        default: '41621085990'
      mode:
        description: Window lifecycle scenario
        type: choice
        default: normal
        options:
          - normal
          - mini
          - early-close
          - direct-quit

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      RUNTIME_RUN: ${{ inputs.runtime_run }}
      CHECK_MODE: ${{ inputs.mode }}
      GSK_RENDERER: cairo
      NEWELLE_DEBUG_WINDOWING: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Load packaged runtime
        run: |
          gh run download "$RUNTIME_RUN" --repo "$GITHUB_REPOSITORY" --name Newelle-macos-arm64-dmg --dir runtime
          images=(runtime/*.dmg)
          mount_dir="$RUNNER_TEMP/newelle-runtime"
          mkdir -p "$mount_dir" dist
          hdiutil attach "${images[0]}" -mountpoint "$mount_dir" -nobrowse -readonly
          trap 'hdiutil detach "$mount_dir"' EXIT
          ditto "$mount_dir/Newelle.app" dist/Newelle.app
      - name: Apply current application code
        run: |
          rsync -a --delete --exclude '__pycache__' --exclude '*.pyc' src/ dist/Newelle.app/Contents/Resources/app/src/
          cp macos/run_newelle.py macos/smoke_test.py macos/windowing.py dist/Newelle.app/Contents/Resources/app/macos/
          codesign --force --sign - dist/Newelle.app
          codesign --verify --deep --strict dist/Newelle.app
      - name: Check window lifecycle
        timeout-minutes: 3
        run: |
          args=(--smoke-test)
          case "$CHECK_MODE" in
            mini) args+=(--mini) ;;
            early-close) args+=(--close-during-startup) ;;
            direct-quit) args+=(--direct-quit) ;;
          esac
          dist/Newelle.app/Contents/MacOS/Newelle "${args[@]}"
